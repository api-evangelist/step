aid: step
name: Step
description: >-
  Step is an all-in-one mobile banking platform built for teens, young adults, and
  families. The Step Visa Card is a secured card that builds credit history reported
  to Experian, Equifax, and TransUnion, and teens can begin building credit before
  they turn 18 through parent-managed accounts. Step also offers savings rewards,
  cashback with partner brands, EarlyPay paycheck advances up to $250, commission-free
  stock investing powered by DriveWealth, early direct deposit, and the Money 101
  financial education hub. Banking services are provided by partner Evolve Bank &
  Trust, Member FDIC. Founded in 2018 in Palo Alto by CJ MacDonald and Alexey
  Kalinichenko, backed by General Catalyst, and acquired by Beast Industries. Step
  publishes no public developer API; its programmatic surface is limited to a
  consumer service status page and a site llms.txt.
